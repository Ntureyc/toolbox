# Shared reverse proxy block.
#
#   include /etc/nginx/snippets/proxy.conf;
#
# inside a server{} block that has already set proxy_pass.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Websockets and server-sent events need the upgrade headers and a long
# read timeout, otherwise the connection is silently dropped.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    300s;

# Do not buffer - the apps stream responses and buffering breaks SSE.
proxy_buffering off;

# Do not let a slow client tie up an upstream worker.
proxy_limit_rate 0;
